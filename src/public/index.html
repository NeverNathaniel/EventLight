<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#d3ecea" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0b3a3c" media="(prefers-color-scheme: dark)" />
  <title>EventLight</title>
  <meta name="description" content="What's on this week: live music, comedy and films across Seattle, Tacoma and the South Sound." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/app.css" />
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <div class="app" id="app">
    <header class="top">
      <a class="word" href="#week">Event<b>Light</b></a>
      <div class="top-right">
        <a class="updated" id="updated" href="/settings.html"></a>
        <nav class="topnav" aria-label="Main">
          <a href="#week" data-nav="week">Week</a>
          <a href="#explore" data-nav="explore">Explore</a>
          <a href="#saved" data-nav="saved">Saved</a>
          <a href="/settings.html">Settings</a>
        </nav>
      </div>
    </header>
    <main id="view"><p class="loading">Loading your week…</p></main>
  </div>

  <nav class="tabbar" aria-label="Main">
    <a href="#week" data-nav="week">Week</a>
    <a href="#explore" data-nav="explore">Explore</a>
    <a href="#saved" data-nav="saved">Saved</a>
    <a href="/settings.html">Settings</a>
  </nav>

  <div class="backdrop" id="backdrop" hidden></div>
  <aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Details" hidden>
    <div class="sheet-bar">
      <button class="sbtn invisible" data-act="back">‹ Back</button>
      <span class="grab" aria-hidden="true"></span>
      <button class="sbtn close" data-act="close">Close</button>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
    <div class="sheet-acts" id="sheet-acts" hidden></div>
  </aside>
  <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
